; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = dfrobot_firebeetle2_esp32e
; default_envs = firebeetle32


; default options for each '[env:**]'
[env]
platform = espressif32 @ 6.13.0
framework = arduino
build_unflags = '-std=gnu++11'
build_flags = '-Wall' '-std=gnu++17'
lib_deps =
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit Unified Sensor @ 1.1.15
  bblanchon/ArduinoJson @ 7.4.3
  zinggjm/GxEPD2 @ 1.6.8


[env:dfrobot_firebeetle2_esp32e]
board = dfrobot_firebeetle2_esp32e
monitor_speed = 115200
; override default partition table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = huge_app.csv
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L

; Diagnostic build: holds display power for one minute to measure VCC,
; then draws a simple pattern without Wi-Fi, weather APIs or deep sleep.
[env:dfrobot_firebeetle2_esp32e_epd_measure]
extends = env:dfrobot_firebeetle2_esp32e
build_flags =
  ${env.build_flags}
  -DEPD_VCC_MEASUREMENT_HOLD_MS=60000
  -DEPD_DIAGNOSTIC_PATTERN=1

; Multimeter test for the RST wire at the display's 8-pin connector.
[env:dfrobot_firebeetle2_esp32e_rst_probe]
extends = env:dfrobot_firebeetle2_esp32e
build_flags =
  ${env.build_flags}
  -DEPD_RST_PIN_PROBE=1

; Multimeter test for the four output wires at the display's 8-pin connector.
[env:dfrobot_firebeetle2_esp32e_spi_probe]
extends = env:dfrobot_firebeetle2_esp32e
build_flags =
  ${env.build_flags}
  -DEPD_SPI_PIN_PROBE=1

; Full display test at 250 kHz instead of the library's default 4 MHz SPI.
[env:dfrobot_firebeetle2_esp32e_epd_slow_spi]
extends = env:dfrobot_firebeetle2_esp32e
build_flags =
  ${env.build_flags}
  -DEPD_DIAGNOSTIC_PATTERN=1
  -DEPD_VCC_MEASUREMENT_HOLD_MS=60000
  -DEPD_DIAGNOSTIC_SPI_HZ=250000


[env:firebeetle32]
board = firebeetle32
monitor_speed = 115200
; override default partition table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = huge_app.csv
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L
